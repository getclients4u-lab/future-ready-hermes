<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FutureReady — AI-Powered Build Platform</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      max-width: 600px;
      padding: 2rem;
    }
    h1 {
      font-size: 3.5rem;
      font-weight: 800;
      margin-bottom: 1rem;
      background: linear-gradient(90deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 1.25rem;
      color: #94a3b8;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      padding: 0.875rem 2rem;
      background: #3b82f6;
      color: white;
      text-decoration: none;
      border-radius: 0.5rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }
    .status {
      margin-top: 3rem;
      padding: 1rem;
      background: rgba(255,255,255,0.05);
      border-radius: 0.5rem;
      font-size: 0.875rem;
      color: #64748b;
    }
    .status span {
      color: #34d399;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>FutureReady</h1>
    <p>AI-powered full-stack code generation. Describe your idea, and our agents build it.</p>
    <a href="https://github.com/getclients4u-lab/future-ready-hermes" class="btn">View on GitHub</a>
    <div class="status">
      <span>●</span> Frontend Live &nbsp;|&nbsp; Backend Deploying
    </div>
  </div>
</body>
</html>
